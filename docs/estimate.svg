idth="264" height="12" rx="3" fill="#4a4743"/><text x="314" y="117" fill="#9c9893" font-size="12" text-anchor="start">0:44</text><rect x="40" y="128" width="366" height="12" rx="3" fill="#4a4743"/><text x="416" y="139" fill="#9c9893" font-size="12" text-anchor="start">0:61</text><rect x="40" y="150" width="282" height="12" rx="3" fill="#D97757"/><text x="332" y="161" fill="#D97757" font-size="12" text-anchor="start">0:47</text></g><g class="fr" style="animation-delay:5s"><text x="40" y="36" fill="#ece9e4" font-size="15" font-weight="700" text-anchor="start">While the agent works, the clock counts down</text><text x="900" y="36" fill="#9c9893" font-size="12.5" text-anchor="end">more requests than usual? it adjusts</text><rect x="40" y="62" width="228" height="12" rx="3" fill="#4a4743"/><text x="278" y="73" fill="#9c9893" font-size="12" text-anchor="start">0:38</text><rect x="40" y="84" width="312" height="12" rx="3" fill="#4a4743"/><text x="362" y="95" fill="#9c9893" font-size="12" text-anchor="start">0:52</text><rect x="40" y="106" width="264" height="12" rx="3" fill="#4a4743"/><text x="314" y="117" fill="#9c9893" font-size="12" text-anchor="start">0:44</text><rect x="40" y="128" width="366" height="12" rx="3" fill="#4a4743"/><text x="416" y="139" fill="#9c9893" font-size="12" text-anchor="start">0:61</text><rect x="40" y="150" width="282" height="12" rx="3" fill="#D97757"/><text x="332" y="161" fill="#D97757" font-size="12" text-anchor="start">0:47</text><rect x="40" y="210" width="282" height="14" rx="3" fill="none" stroke="#4a4743" stroke-dasharray="4 3"/><rect x="40" y="210" width="120" height="14" rx="3" fill="#4C7DF0"/><text x="40" y="248" fill="#9c9893" font-size="12.5" text-anchor="start">this run: 0:20</text><text x="220" y="248" fill="#ece9e4" font-size="13" font-weight="700" text-anchor="start">~0:27 left</text><text x="360" y="248" fill="#9c9893" font-size="12.5" text-anchor="start">expected 0:47</text></g><g class="fr" style="animation-delay:7.5s"><text