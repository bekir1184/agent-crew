name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The site lives in site/ and borrows the README's animations from docs/
      - name: Assemble
        run: |
          mkdir _site
          cp -R site/. _site/
          cp -R docs _site/docs
          sed -i 's#\.\./docs/#docs/#g' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
