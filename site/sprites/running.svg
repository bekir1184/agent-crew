<svg xmlns="http://www.w3.org/2000/svg" width="44" height="34" viewBox="0 0 44 34"><svg x="0" y="0" xmlns="http://www.w3.org/2000/svg" width="44" height="34" viewBox="0 -4 44 34"><style>rect{shape-rendering:crispEdges}.l2{animation:l2 2.4s steps(1,end) infinite}.cursor{animation:on .8s steps(1,end) infinite}.legA{animation:on .5s steps(1,end) infinite}.legB{animation:off .5s steps(1,end) infinite}.hop{animation:hop .7s steps(1,end) infinite}.eye{animation:blink 3.2s steps(1,end) infinite}.eyeShut{animation:blinkShut 3.2s steps(1,end) infinite}@keyframes l2{0%,40%{opacity:0}40.1%,100%{opacity:1}}@keyframes on{0%,49.9%{opacity:1}50%,100%{opacity:0}}@keyframes off{0%,49.9%{opacity:0}50%,100%{opacity:1}}@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes blink{0%,92%{opacity:1}92.1%,97%{opacity:0}97.1%,100%{opacity:1}}@keyframes blinkShut{0%,92%{opacity:0}92.1%,97%{opacity:1}97.1%,100%{opacity:0}}</style><rect x="30" y="4" width="14" height="14" fill="#3A4A40"/><rect x="32" y="6" width="10" height="10" fill="#1F2A24"/><rect x="32" y="8" width="2" height="2" fill="#4BE08A"/><rect x="34" y="10" width="2" height="2" fill="#4BE08A"/><rect x="32" y="12" width="2" height="2" fill="#4BE08A"/><g class="l2"><rect x="36" y="8" width="4" height="2" fill="#2C7A50"/></g><g class="cursor"><rect x="36" y="12" width="4" height="2" fill="#4BE08A"/></g><rect x="28" y="18" width="18" height="2" fill="#8A8F98"/><rect x="30" y="20" width="14" height="2" fill="#5E636C"/><rect x="6" y="28" width="20" height="2" fill="#00000018"/><g class="legA"><rect x="8" y="24" width="2" height="4" fill="#D97757"/><rect x="12" y="24" width="2" height="4" fill="#D97757"/><rect x="18" y="24" width="2" height="4" fill="#D97757"/><rect x="22" y="24" width="2" height="4" fill="#D97757"/></g><g class="legB"><rect x="8" y="24" width="2" height="2" fill="#D97757"/><rect x="12" y="24" width="2" height="4" fill="#D97757"/><rect x="18" y="24" width="2" height="2" fill="#D97757"/><rect x="22" y="24" width="2" height="4" fill="#D97757"/></g><g class="hop"><rect x="6" y="10" width="20" height="14" fill="#D97757"/><rect x="4" y="14" width="2" height="4" fill="#D97757"/><rect x="26" y="14" width="2" height="4" fill="#D97757"/><g class="eye"><rect x="12" y="14" width="2" height="4" fill="#2B211C"/><rect x="22" y="14" width="2" height="4" fill="#2B211C"/></g><g class="eyeShut"><rect x="12" y="16" width="2" height="2" fill="#2B211C"/><rect x="22" y="16" width="2" height="2" fill="#2B211C"/></g></g></svg></svg>